      ''no'', or ''idk'', which states whether the given claim agrees with the context.
      \n            Provide a ''reason'' ONLY if the answer is ''no'' or ''idk''.
      \n            The provided claim is drawn from the actual output. Try to provide
      a correction in the reason using the facts in the retrieval context.\n\n\nExpected
      JSON format:\n{{\n    \"verdicts\": [\n        {{\n            \"verdict\":
      \"yes\"\n        }},\n        {{\n            \"reason\": <explanation_for_contradiction>,\n            \"verdict\":
      \"no\"\n        }},\n        {{\n            \"reason\": <explanation_for_uncertainty>,\n            \"verdict\":
      \"idk\"\n        }}\n    ]  \n}}\n\n\n            **\n            IMPORTANT:
      Please make sure to only return in JSON format, with the ''verdicts'' key as
      a list of JSON objects.\n\nGenerate ONE verdict per claim - length of ''verdicts''
      MUST equal number of claims.\nNo ''reason'' needed for ''yes'' verdicts.\nOnly
      use ''no'' if retrieval context DIRECTLY CONTRADICTS the claim - never use prior
      knowledge.\nUse ''idk'' for claims not backed up by context OR factually incorrect
      but non-contradictory - do not assume your knowledge.\nVague/speculative language
      in claims (e.g. ''may have'', ''possibility'') does NOT count as contradiction.\n\n            **\n\n            Retrieval
      Contexts:\n            The Earth has a diameter of approximately 12,742 kilometers.\n\n            Claims:\n            [''The
      diameter of the Earth is approximately 12,742 kilometers.'']\n\n            JSON:\n","role":"user"}],"model":null,"stream":true,"stream_options":{"include_usage":true},"tool_choice":{"type":"function","function":{"name":"Verdicts"}},"tools":[{"type":"function","function":{"name":"Verdicts","description":"","parameters":{"properties":{"verdicts":{"items":{"properties":{"verdict":{"enum":["yes","no","idk"],"type":"string"},"reason":{"anyOf":[{"type":"string"},{"type":"null"}],"default":null}},"required":["verdict"],"type":"object"},"type":"array"}},"required":["verdicts"],"type":"object"}}}]}'
