- request:
    body: '{"messages":[{"content":"\nNatural language inference is the task of determining
      whether the hypothesis is an entailment, contradiction, or neutral with respect
      to the premise.\nA hypothesis is a list of statements provided below. \n\n\n\nA
      statement is considered an entailment if it logically follows from the premise.\nA
      statement is considered a contradiction if it is logically inconsistent with
      the premise.\nElse a statement is considered a neutral.\nImportant: Don''t reject
      entailment just because of minor extra details - if the main meaning holds,
      it''s still entailment.\n\nFor each statement:\nProvide a brief short(1 sentences)
      explanation of whether the statement is an entailment, contradiction or neutral
      with respect to the premise.\nAssign tags based on your explanation: \"ENT\"
      for entailment, \"CONT\" for contradiction, \"NEUT\" for neutral or if none
      of the above tags apply.\n\nFormat your response in JSON. You must return only
      JSON.\n\nFor example, if the premise is \"I am a biology graduate and I work
      at a tech company.\" and the list of statements is [\"I am a graduate.\", \"I
      work at a hospital.\"] your response should be:\n\n```json\n{\n    \"statement_inference\":
      [\n        {\n            \"explanation\": \"It is true that I am a graduate\",\n            \"tag\":
      \"ENT\"\n        },\n        {\n            \"explanation\": \"Premise states
      I work at a tech company, not a hospital.\",\n            \"tag\": \"CONT\"\n        }\n    ]\n}\n```\n\nYour
      response must be in JSON format:\n```json\n{\n    \"statement_inference\": [\n        {\n            \"explanation\":
      <<explanation>>,\n            \"tag\": <<\"ENT\" or \"CONT\" or \"NEUT\">>\n        },\n        ...\n    ]\n}\n```\nRequest:\n\n\n<premise>\nThe
      Earth is the third planet from the Sun. The diameter of the Earth is approximately
      12,742 kilometers.\n</premise>\n\nList of statements:\n\n<statement1> The Earth
      has a diameter of about 12,742 km. </statement1>\n","role":"user"}],"model":null,"stream":true,"stream_options":{"include_usage":true}}'
