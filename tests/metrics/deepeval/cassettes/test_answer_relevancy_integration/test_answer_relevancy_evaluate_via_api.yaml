      \"no\"\n        },\n        {\n            \"reason\": <explanation_for_ambiguity>,\n            \"verdict\":
      \"idk\"\n        }\n    ]  \n}\n\nGenerate ONE verdict per statement - number
      of ''verdicts'' MUST equal number of statements.\n''verdict'' must be STRICTLY
      ''yes'', ''no'', or ''idk'':\n- ''yes'': statement is relevant to addressing
      the input\n- ''no'': statement is irrelevant to the input  \n- ''idk'': statement
      is ambiguous (not directly relevant but could be supporting information)\nProvide
      ''reason'' ONLY for ''no'' or ''idk'' verdicts.\n**          \n\nInput:\nWhat
