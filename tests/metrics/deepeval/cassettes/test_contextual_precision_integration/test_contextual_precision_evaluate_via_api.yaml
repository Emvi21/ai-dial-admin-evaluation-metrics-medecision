- request:
    body: '{"messages":[{"content":"Given the input, retrieval contexts, and contextual
      precision score, provide a CONCISE summary for the score. Explain why it is
      not higher, but also why it is at its current score.\n            The retrieval
      contexts is a list of JSON with three keys: `verdict`, `reason` (reason for
      the verdict) and `node`. `verdict` will be either ''yes'' or ''no'', which represents
      whether the corresponding ''node'' in the retrieval context is relevant to the
      input. \n            Contextual precision represents if the relevant nodes are
      ranked higher than irrelevant nodes. Also note that retrieval contexts is given
      IN THE ORDER OF THEIR RANKINGS.\n\n            **\n            IMPORTANT: Please
      make sure to only return in JSON format, with the ''reason'' key providing the
      reason.\n            Example JSON:\n            {\n                \"reason\":
      \"The score is <contextual_precision_score> because <your_reason>.\"\n            }\n\n\n            DO
      NOT mention ''verdict'' in your reason, but instead phrase it as irrelevant
      nodes. The term ''verdict'' is just here for you to understand the broader scope
      of things.\n            Also DO NOT mention there are `reason` fields in the
      retrieval contexts you are presented with, instead just use the information
      in the `reason` field.\n            In your reason, you MUST USE the `reason`,
      QUOTES in the ''reason'', and the node RANK (starting from 1, eg. first node)
      to explain why the ''no'' verdicts should be ranked lower than the ''yes'' verdicts.\n            When
      addressing nodes, make it explicit that they are nodes in retrieval contexts.\n            If
      the score is 1, keep it short and say something positive with an upbeat tone
      (but don''t overdo it otherwise it gets annoying).\n            **\n\n            Contextual
      Precision Score:\n            1.00\n\n            Input:\n            What is
      the diameter of the Earth?\n\n            Retrieval Contexts:\n            [{''verdict'':
      ''yes'', ''reason'': \"The text directly answers the question by stating ''The
      Earth has a diameter of approximately 12,742 kilometers.''\"}, {''verdict'':
      ''no'', ''reason'': \"This text, ''The Earth is the third planet from the Sun,''
      does not provide any information about the Earth''s diameter.\"}]\n\n            JSON:\n","role":"user"}],"model":null,"stream":true,"stream_options":{"include_usage":true},"tool_choice":{"type":"function","function":{"name":"ContextualPrecisionScoreReason"}},"tools":[{"type":"function","function":{"name":"ContextualPrecisionScoreReason","description":"","parameters":{"properties":{"reason":{"type":"string"}},"required":["reason"],"type":"object"}}}]}'
