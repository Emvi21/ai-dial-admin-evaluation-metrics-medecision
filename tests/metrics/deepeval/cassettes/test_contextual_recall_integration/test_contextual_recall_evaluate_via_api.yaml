- request:
    body: '{"messages":[{"content":"Given the original expected output, a list of
      supportive reasons, and a list of unsupportive reasons (which are deduced directly
      from the original expected output), and a contextual recall score (closer to
      1 the better), summarize a CONCISE reason for the score.\n            A supportive
      reason is the reason why a certain sentence in the original expected output
      can be attributed to the node in the retrieval context.\n            An unsupportive
      reason is the reason why a certain sentence in the original expected output
      cannot be attributed to anything in the retrieval context.\n            In your
      reason, you should relate supportive/unsupportive reasons to the sentence number
      in expected output, and include info regarding the node number in retrieval
      context to support your final reason. The first mention of \"node(s)\" should
      specify \"node(s) in retrieval context.\n\n            **\n            IMPORTANT:
      Please make sure to only return in JSON format, with the ''reason'' key providing
      the reason.\n            Example JSON:\n            {\n                \"reason\":
      \"The score is <contextual_recall_score> because <your_reason>.\"\n            }\n\n            DO
      NOT mention ''supportive reasons'' and ''unsupportive reasons'' in your reason,
      these terms are just here for you to understand the broader scope of things.\n            If
      the score is 1, keep it short and say something positive with an upbeat encouraging
      tone (but don''t overdo it otherwise it gets annoying).\n            **\n\n            Contextual
      Recall Score:\n            1.00\n\n            Expected Output:\n            The
