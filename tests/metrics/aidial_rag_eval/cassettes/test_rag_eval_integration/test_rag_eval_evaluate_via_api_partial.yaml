- request:
    body: '{"messages":[{"content":"\nBreak down each hypothesis into statements,
      if hypothesis is complex. Else return hypothesis as a single statement.\n\nA
      statement is a declarative independent self-contained non-overlapping substring
      forming a complete sentence derived from the hypothesis.\n\nSingle words, signs,
      numbers, links, etc. are not statements.\n\nYour response must be in JSON format:\n```json\n{\n    \"hypothesis_statements\":
      [\n        {\n            \"statements\": [\n                <<statement1 from
      the first hypothesis>>,\n                <<statement2 from the first hypothesis>>,\n                ...\n            ]\n        },\n        {\n            \"statements\":
      [\n                <<statement1 from the second hypothesis>>,\n                <<statement2
      from the second hypothesis>>,\n                ...\n            ]\n        },\n        ...\n    ]\n}\n```\n\nRequest:\nHypotheses:\n\n<hypothesis1>
      Earth has a diameter of about 12,742 km. </hypothesis1>\n\n<hypothesis2> Earth
      is a third planet. </hypothesis2>\n\n<hypothesis3> And Earth has a single moon.
      </hypothesis3>\n","role":"user"}],"model":null,"stream":true,"stream_options":{"include_usage":true}}'
